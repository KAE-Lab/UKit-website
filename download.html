<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0B12">
    <title>Télécharger UKit</title>
    <meta name="description" content="Télécharge UKit sur l'App Store ou sur Google Play.">

    <!-- Redirection vers le store du téléphone, le plus haut possible : avant tout rendu. -->
    <script>
        (function () {
            var ua = navigator.userAgent;
            if (/android/i.test(ua)) {
                window.location.replace('https://play.google.com/store/apps/details?id=com.bordeaux1.emplois');
            } else if (/iphone|ipad|ipod/i.test(ua)) {
                window.location.replace('https://apps.apple.com/app/id1394708917');
            }
        })();
    </script>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Télécharger UKit">
    <meta property="og:description" content="Télécharge UKit sur l'App Store ou sur Google Play.">
    <meta property="og:url" content="%VITE_SITE_URL%/download.html">
    <meta property="og:image" content="%VITE_SITE_URL%/opengraph-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <header class="tete conteneur">
        <a href="/" aria-label="UKit, accueil"><img class="logo" src="/logo-ukit.svg" width="850" height="343" alt="UKit"></a>
    </header>

    <main class="seule conteneur">
        <h1 class="titre">Télécharger UKit</h1>
        <p class="slogan">Gratuite, sur iOS et Android.</p>
        <div class="magasins">
                <a href="https://apps.apple.com/app/id1394708917" rel="noopener">
                    <img src="/badge-app-store.svg" alt="Télécharger dans l'App Store" width="127" height="40">
                </a>
                <a href="https://play.google.com/store/apps/details?id=com.bordeaux1.emplois" rel="noopener">
                    <img src="/badge-google-play.svg" alt="Disponible sur Google Play" width="135" height="40">
                </a>
            </div>
        <div class="qr">
            <img src="/qrcode.png" width="1184" height="1184" alt="QR code de téléchargement de UKit">
            <p>Depuis un ordinateur,<br>scanner le code avec un téléphone.</p>
        </div>
    </main>

    <footer class="pied">
        <div class="conteneur">
            <p>UKit est développé par <a href="https://kaelab.dev" rel="noopener">KAE Lab</a>, association étudiante.</p>
            <nav aria-label="Pages légales">
                <a href="/mentions-legales.html">Mentions légales</a>
                <a href="/confidentialite.html">Confidentialité</a>
                <a href="https://github.com/KAE-Lab/UKit" rel="noopener">Code source</a>
            </nav>
        </div>
    </footer>
</body>

</html>
